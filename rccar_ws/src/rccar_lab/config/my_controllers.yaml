# standard ros parameters file
controller_manager:
  ros__parameters:
    update_rate: 30 # hertz
    use_sim_time: true # bc Gazebo

    # below here we specify all of our controllers


    # diff_cont is just the name we choose for it. 
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

# copy and paste parameters for the controllers

diff_cont:
  ros__parameters:
    # publish rate throttled by controller manager
    publish_rate: 50.0

    base_frame_id: base_link

    left_wheel_names: ['fl_wheel_joint', 'bl_wheel_joint']
    right_wheel_names: ['fr_wheel_joint', 'br_wheel_joint']
    wheel_separation: 0.0871 # 87.1mm
    wheel_radius: 0.0325 # 32.5mm

    use_stamped_vel: false

# we don't have any parameters we need to set for JSB, so it's commented out

